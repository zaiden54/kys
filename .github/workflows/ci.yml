# This workflow runs checks only — it never deploys. Vercel's native git integration
# (already active on this repo) is the sole deployer for every environment. See
# DEPLOYMENT.md and this plan's DEPLOY-05 prohibition before adding any deploy step here.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure test environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Push database schema
        run: npm run db:push

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
